<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Quiz</title>
<style>
  :root { --red:#c6283d; --green:#176b4a; --gold:#ffd166; --ink:#18352b; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(circle at top, #fff8e8 0, #e5f3e9 48%, #cfe6d7 100%);
    display:grid; place-items:center; padding:24px;
  }
  .snow { position:fixed; inset:0; pointer-events:none; opacity:.35;
    background-image: radial-gradient(white 1.5px, transparent 1.5px);
    background-size: 34px 34px; }
  main { width:min(720px,100%); position:relative; }
  .card {
    background:#fffdf7; border:3px solid white; border-radius:28px;
    box-shadow:0 18px 55px #16432b24; padding:clamp(22px,5vw,42px);
  }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .tag { background:#e7f2e9; color:var(--green); padding:7px 13px; border-radius:999px; font-size:.82rem; font-weight:800; }
  h1 { font-size:clamp(2.2rem,7vw,4rem); line-height:1; margin:18px 0 8px; color:var(--red); text-align:center; }
  .subtitle { text-align:center; margin:0 0 26px; color:#587166; }
  .decor { text-align:center; font-size:2rem; letter-spacing:8px; }
  .progress-wrap { height:10px; background:#e8eee8; border-radius:20px; overflow:hidden; margin:20px 0 10px; }
  #progress { height:100%; width:10%; background:linear-gradient(90deg,var(--green),#45a477); transition:width .25s; }
  .meta { display:flex; justify-content:space-between; color:#64776d; font-size:.9rem; font-weight:700; }
  h2 { font-size:clamp(1.3rem,4vw,1.8rem); margin:25px 0 20px; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { font:inherit; cursor:pointer; }
  .answer {
    min-height:76px; border:2px solid #e4e9e2; border-radius:16px; padding:14px;
    background:white; color:var(--ink); font-weight:750; text-align:left;
    display:flex; align-items:center; gap:12px; transition:.15s;
  }
  .answer:hover:not(:disabled) { transform:translateY(-2px); border-color:var(--green); background:#f2faf4; }
  .letter { width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:10px; background:#edf3ee; }
  .answer.correct { border-color:#218653; background:#e7f7ed; }
  .answer.wrong { border-color:#c6283d; background:#fff0f1; }
  .answer:disabled { cursor:default; }
  #feedback { min-height:28px; margin:18px 0 4px; font-weight:750; }
  .actions { display:flex; justify-content:flex-end; margin-top:16px; }
  .primary { border:0; background:var(--green); color:white; border-radius:999px; padding:13px 24px; font-weight:800; }
  .primary:hover { background:#10563a; }
  .primary:disabled { opacity:.4; cursor:not-allowed; }
  .center { text-align:center; }
  .big-score { font-size:3.5rem; color:var(--green); font-weight:900; margin:10px; }
  .hidden { display:none !important; }
  .small { color:#718178; font-size:.9rem; }
  @media(max-width:520px) { .answers { grid-template-columns:1fr; } .answer { min-height:62px; } }
</style>
</head>
<body>
<div class="snow"></div>
<main>
  <section class="card" id="quiz">
    <div class="top"><span class="tag">🎄 CHRISTMAS SPECIAL</span><span class="tag" id="scoreTag">⭐ Score: 0</span></div>
    <div class="decor" aria-hidden="true">🎅 ❄️ 🎁</div>
    <h1>Christmas Quiz</h1>
    <p class="subtitle">How much do you know about Christmas?</p>
    <div class="progress-wrap"><div id="progress"></div></div>
    <div class="meta"><span id="questionCount">Question 1 of 10</span><span id="points">10 points</span></div>
    <h2 id="question">When is Christmas Day?</h2>
    <div class="answers" id="answers"></div>
    <p id="feedback" aria-live="polite"></p>
    <div class="actions"><button class="primary" id="next" disabled>Next question →</button></div>
  </section>
  <section class="card center hidden" id="result">
    <div class="decor">🎄 ✨ 🎁</div>
    <h1>Quiz complete!</h1>
    <p class="subtitle">Your Christmas knowledge score:</p>
    <div class="big-score" id="finalScore">0 / 100</div>
    <h2 id="message">Well done!</h2>
    <p id="summary" class="small"></p>
    <button class="primary" id="restart">Play again ↻</button>
  </section>
</main>
<script>
const questions = [
  { q:"When is Christmas Day?", a:["December 24","December 25","December 26","December 31"], correct:1, explain:"Christmas Day is celebrated on December 25." },
  { q:"What is the name of Santa's red-nosed reindeer?", a:["Dasher","Comet","Rudolph","Blitzen"], correct:2, explain:"Rudolph is famous for his glowing red nose." },
  { q:"What do people traditionally put on top of a Christmas tree?", a:["A hat","A star","A snowball","A present"], correct:1, explain:"A star or an angel is traditionally placed at the top." },
  { q:"Where does Santa Claus traditionally live?", a:["The South Pole","Canada","The North Pole","London"], correct:2, explain:"In Christmas stories, Santa Claus lives at the North Pole." },
  { q:"What are gingerbread houses mainly made of?", a:["Chocolate","Bread","Gingerbread","Cheese"], correct:2, explain:"Gingerbread houses are built from gingerbread pieces, often held together with icing." },
  { q:"Which country is especially famous for its traditional Christmas markets?", a:["Germany","Australia","Brazil","Japan"], correct:0, explain:"Germany is well known for its traditional Christmas markets." },
  { q:"What colour are traditional candy canes?", a:["Blue and yellow","Red and white","Green and purple","Black and white"], correct:1, explain:"Traditional candy canes are usually red and white." },
  { q:"What do people traditionally hang by the fireplace for Santa?", a:["Shoes","Stockings","Jackets","Bags"], correct:1, explain:"Christmas stockings are hung up to be filled with small gifts." },
  { q:"What is a snowman's nose traditionally made from?", a:["A carrot","An apple","A banana","A potato"], correct:0, explain:"A carrot is the classic snowman nose." },
  { q:"Which day comes after Christmas Day?", a:["Christmas Eve","Halloween","Boxing Day","New Year's Eve"], correct:2, explain:"Boxing Day is December 26, the day after Christmas." }
];
let current = 0, score = 0, locked = false;
const $ = id => document.getElementById(id);
function renderQuestion() {
  locked = false;
  const item = questions[current];
  $("question").textContent = item.q;
  $("questionCount").textContent = `Question ${current+1} of ${questions.length}`;
  $("points").textContent = "10 points";
  $("progress").style.width = `${(current/questions.length)*100}%`;
  $("scoreTag").textContent = `⭐ Score: ${score}`;
  $("feedback").textContent = "";
  $("next").disabled = true;
  $("next").textContent = current === questions.length-1 ? "See my score →" : "Next question →";
  $("answers").innerHTML = "";
  item.a.forEach((answer, i) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.innerHTML = `<span class="letter">${["A","B","C","D"][i]}</span><span></span>`;
    btn.querySelector("span:last-child").textContent = answer;
    btn.addEventListener("click", () => choose(i));
    $("answers").appendChild(btn);
  });
}
function choose(index) {
  if (locked) return;
  locked = true;
  const item = questions[current];
  const buttons = [...$("answers").children];
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct) btn.classList.add("correct");
    else if (i === index) btn.classList.add("wrong");
  });
  if (index === item.correct) {
    score += 10;
    $("feedback").textContent = "🎉 Correct! " + item.explain;
    $("feedback").style.color = "#176b4a";
  } else {
    $("feedback").textContent = "Not quite! " + item.explain;
    $("feedback").style.color = "#b3263a";
  }
  $("scoreTag").textContent = `⭐ Score: ${score}`;
  $("next").disabled = false;
}
function finish() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("progress").style.width = "100%";
  $("finalScore").textContent = `${score} / 100`;
  const percent = score;
  $("message").textContent = percent === 100 ? "🎅 Perfect score!" : percent >= 70 ? "🎄 Fantastic job!" : percent >= 40 ? "✨ Nice try!" : "🎁 Keep practising!";
  $("summary").textContent = `You got ${score/10} out of ${questions.length} questions correct.`;
}
$("next").addEventListener("click", () => {
  if (!locked) return;
  current++;
  if (current < questions.length) renderQuestion();
  else finish();
});
$("restart").addEventListener("click", () => {
  current = 0; score = 0;
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  renderQuestion();
});
renderQuestion();
</script>
</body>
</html>
